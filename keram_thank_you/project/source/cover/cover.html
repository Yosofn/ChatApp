<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Fredoka;src:url(../fonts/Fredoka.ttf)}
@font-face{font-family:Amiri;src:url(../fonts/Amiri-Bold.ttf);font-weight:700}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#142E43}
.bg{position:absolute;inset:0;background:url(frame.png) center/cover;transform:scale(1.06);transform-origin:50% 40%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,46,67,0) 0%,rgba(20,46,67,0) 50%,rgba(20,46,67,.8) 66%,rgba(20,46,67,.96) 82%)}
.logo{position:absolute;left:60px;top:300px;width:150px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.wrap{position:absolute;left:0;right:0;top:1170px;text-align:center}
.kick{display:inline-block;font:600 46px Fredoka;color:#142E43;background:#FBF4E6;padding:12px 34px;border-radius:999px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.big{font:700 210px/1 Fredoka;color:#fff;margin-top:26px;letter-spacing:-2px;text-shadow:0 10px 0 #C08847,0 18px 40px rgba(0,0,0,.4)}
.big span{color:#DFA962;text-shadow:0 10px 0 #8a5f2c,0 18px 40px rgba(0,0,0,.4)}
.ar{font:700 60px/1.6 Amiri;direction:rtl;color:#FBF4E6;margin-top:34px}
.ar b{color:#DFA962}
.line{width:140px;height:8px;border-radius:8px;background:#DFA962;margin:10px auto 0}
.heart{position:absolute;left:830px;top:1150px;width:130px;transform:rotate(12deg)}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<img class="logo" src="../assets/logo_white.png">
<svg class="heart" viewBox="0 0 200 200"><path stroke="#142E43" stroke-width="8" stroke-linejoin="round" fill="#F28B82" d="M100 170C40 128 20 100 20 70a40 40 0 0 1 80-12 40 40 0 0 1 80 12c0 30-20 58-80 100z"/><path d="M55 62a18 18 0 0 1 18-14" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".85"/></svg>
<div class="wrap">
  <div class="kick">Teach your child to say</div>
  <div class="big">Thank <span>you</span></div>
  <div class="line"></div>
  <div class="ar">مَنْ لَا يَشْكُرِ <b>النَّاسَ</b> لَا يَشْكُرِ <b>اللَّهَ</b></div>
</div>
</body></html>
